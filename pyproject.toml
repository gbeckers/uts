[build-system]
# Replaces the old distutils / numpy.distutils build, which cannot run on
# Python 3.12 or later.
#
# Build with --no-build-isolation so the extensions compile against the numpy
# already in the environment. An isolated build fetches its own numpy, and
# extensions built against numpy 2 cannot be imported alongside numpy 1.
requires = [
    "setuptools>=64",
    "setuptools-scm>=8",
    "cython>=3.0.10",
    "numpy>=1.22",
]
build-backend = "setuptools.build_meta"

[project]
name = "uts"
description = "A python package for uniform time series manipulation and analysis"
readme = "README.rst"
license = { file = "LICENSE" }
authors = [
    { name = "Gabriel J.L. Beckers", email = "gabriel@gbeckers.nl" },
]
requires-python = ">=3.9"
dynamic = ["version"]

# Everything imported at package import time. cython is a build dependency and
# belongs in [build-system], not here, which is where the old setup.py had it.
dependencies = [
    "numpy>=1.22",
    "scipy",
    "pandas",
    "tables",
    "h5py",
    "darr",
    "numexpr",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
# Imported lazily, inside the functions that need them, so the package works
# without them.
edf = ["pyedflib"]
audio = ["scikits.audiolab"]
progressbar = ["ipython"]
test = ["pytest"]

[project.urls]
Source = "https://github.com/gbeckers/uts"

[tool.setuptools]
packages = [
    "uts",
    "uts.core",
    "uts.processing",
    "uts.tests",
    "uts.signalfactory",
    "uts.helper",
    "uts.io",
    "uts.exampledata",
    "uts.testdata",
]

[tool.setuptools.package-data]
"uts.exampledata" = ["*.h5"]
"uts.testdata" = ["*.mat"]

[tool.setuptools_scm]
# Replaces versioneer 0.16, which imported distutils and so was itself a
# blocker for Python 3.12. The 25 existing v-prefixed tags are read as they
# are. "no-guess-dev" keeps the version anchored to the last real tag instead
# of guessing the next one, so a version still says which release it came
# after.
version_scheme = "no-guess-dev"
local_scheme = "node-and-date"

[tool.cibuildwheel]
# Kept here rather than in the workflow so that a local `cibuildwheel` run
# builds the same set as CI does.
#
# The wheels are built in isolation, against whatever numpy pip resolves for
# each interpreter. That is deliberate and is the opposite of the advice in
# [build-system] above: an extension compiled against numpy 2 headers stays
# importable under numpy >= 1.19 at runtime, while one compiled against
# numpy 1 does not work under numpy 2. Building against the newer numpy is
# therefore the only direction that serves both the pinned analysis
# environment and current installs from a single wheel.
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"

# PyPy has no numpy/tables wheels worth relying on here, and musllinux would
# double the Linux matrix for a platform this package has never targeted.
#
# 32-bit Windows is excluded because the wheel would be a lie: numpy still
# publishes win32 wheels, so the build would succeed, but scipy, pandas,
# tables and h5py do not, so nothing could actually install it.
skip = "pp* *-musllinux_* *-win32"

# Importing uts pulls in scipy, pandas and tables, so a wheel that imports at
# all has already proved the extensions load against the numpy the resolver
# picked. The suite then exercises the compiled code itself.
test-requires = "pytest"
test-command = [
    "python -c \"import uts; print('uts', uts.__version__)\"",
    "pytest --pyargs uts -q",
]

[tool.cibuildwheel.macos]
# Both architectures from one runner; the arm64 wheels cannot be tested on an
# x86_64 host, which cibuildwheel skips on its own.
archs = ["x86_64", "arm64"]
