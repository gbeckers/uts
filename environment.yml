# Reference environment for uts.
#
# These are the versions the test suite is known to pass with. They are pinned
# exactly so that results produced with uts can be reproduced by others.
#
#     conda env create -f environment.yml
#     conda activate uts
#     pip install -e . --no-build-isolation
#
# --no-build-isolation matters: it makes the Cython extensions compile against
# the numpy pinned here. An isolated build would fetch its own numpy, and if
# that were numpy 2 the compiled extensions would not match the numpy they are
# imported alongside.
#
# These pins record the environment analyses were run in. They are not upper
# limits on what uts supports: it has been tested to build and pass its suite
# on python 3.14 with numpy 2.5 and pandas 3.0 as well. Pin here what you want
# to reproduce; use looser versions for new work.

name: uts

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11.5
  - numpy=1.25.2
  - scipy=1.11.1
  - pandas=2.0.3
  - pytables=3.8.0
  - h5py=3.9.0
  - numexpr=2.8.4
  - cython=3.0.0
  - matplotlib=3.7.2
  - setuptools=68.0.0
  - darr=0.5.5
  # build tooling
  - setuptools-scm=10.2.1
  # test tooling
  - pytest=7.4.0
