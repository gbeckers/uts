name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # Run every configuration even when one fails, so a numpy 2 break and a
      # pinned-environment break are visible in the same run.
      fail-fast: false
      matrix:
        include:
          # The environment analyses were run in, pinned exactly as in
          # environment.yml. This is the configuration that has to keep
          # working for published results to stay reproducible.
          - name: "pinned (py3.11, numpy 1)"
            python: "3.11"
            pins: >-
              numpy==1.25.2 scipy==1.11.1 pandas==2.0.3 tables==3.8.0
              h5py==3.9.0 numexpr==2.8.4 cython==3.0.0
          # Current numpy 2 and pandas 3 on the same python.
          - name: "numpy 2 (py3.11)"
            python: "3.11"
            pins: >-
              numpy>=2 scipy pandas tables h5py numexpr cython>=3.0.10
          # Newest python, everything latest. Also proves the pyproject build
          # works past 3.11, which the old distutils build could not.
          - name: "latest (py3.14, numpy 2)"
            python: "3.14"
            pins: >-
              numpy>=2 scipy pandas tables h5py numexpr cython>=3.0.10

    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools-scm derives the version from the git tags, and a
          # shallow clone fetches none: the version comes out as
          # 0.0.post1.dev1+g<hash> instead of 2.4.5.post1.dev10+g<hash>.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel "setuptools-scm>=8" pytest darr
          python -m pip install ${{ matrix.pins }}

      - name: Build and install uts
        # --no-build-isolation so the extensions compile against the numpy
        # installed above rather than one pip fetches for the build. Installed
        # rather than editable, so the tests run against a real installation.
        run: python -m pip install . --no-build-isolation --no-deps

      - name: Report versions
        run: |
          python -c "import sys, numpy, pandas, uts; print('python', sys.version)"
          python -c "import numpy, pandas, uts; print('numpy', numpy.__version__, 'pandas', pandas.__version__)"
          python -c "import uts; print('uts', uts.__version__)"
        working-directory: ${{ runner.temp }}

      - name: Run the package's own test runner
        # uts.test() returns a TestResult and does not set an exit status, so
        # a bare call would report success even with failing tests.
        run: >-
          python -c "import sys, uts; sys.exit(0 if uts.test().wasSuccessful() else 1)"
        working-directory: ${{ runner.temp }}

      - name: Run pytest
        # pytest collects ten module-level test functions that uts.test() does
        # not, because that runner loads only TestCase subclasses. All of them
        # are expected to pass; nothing is excluded.
        run: pytest --pyargs uts -q
        working-directory: ${{ runner.temp }}
